name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  compatibility:
    name: Node ${{ matrix.node }} / Electron ${{ matrix.electron }} / x64
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22.12.0
            electron: 43.0.0
            uia: false
          - node: 22.12.0
            electron: 43.4.0
            uia: false
          - node: 24
            electron: 43.4.0
            uia: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Select Electron compatibility version
        run: npm install --no-save --package-lock=false electron@${{ matrix.electron }}

      - name: Restore Windows App SDK metadata
        run: npm run restore

      - name: Generate WinRT bindings
        run: npm run generate

      - name: Build
        run: npm run build

      - name: Prepare Electron executable (CLI validation)
        run: |
          node dist/cli.js prepare --dry-run
          node dist/cli.js prepare
          node dist/cli.js prepare --check

      - name: Test
        run: |
          npm run test:types
          npm run test:unit
          npm run test:smoke

      - name: Test native UI Automation
        if: matrix.uia
        run: npm run test:uia

      - name: Upload native UI Automation artifacts
        if: always() && matrix.uia
        uses: actions/upload-artifact@v7
        with:
          name: native-ui-automation-node-${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/uia/artifacts/
          if-no-files-found: error

  package:
    name: Pack, install, and consume (x64 + arm64 artifacts)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore Windows App SDK metadata
        run: npm run restore

      - name: Generate WinRT bindings
        run: npm run generate

      - name: Create release candidate tarball
        shell: pwsh
        env:
          ELECTRON_WINUI_PACK_DESTINATION: artifacts
        run: |
          New-Item -ItemType Directory -Path artifacts | Out-Null
          npm run pack:preview
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the policy-approved npm tarball.'
          }
          $tarballs = @(Get-ChildItem artifacts -Filter *.tgz -File)
          if ($tarballs.Count -ne 1) {
            throw "Expected exactly one npm tarball; found $($tarballs.Count)."
          }
          "ELECTRON_WINUI_TARBALL=$($tarballs[0].FullName)" >> $env:GITHUB_ENV

      - name: Install and consume release candidate
        run: npm run test:package

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: electron-winui-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.tgz
          if-no-files-found: error

  non-windows-fallback:
    name: Installed package fallback (Linux)
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0

      - name: Download release candidate
        uses: actions/download-artifact@v8
        with:
          name: electron-winui-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts

      - name: Clean-install release candidate
        run: |
          mkdir consumer
          npm install --prefix consumer ./artifacts/*.tgz electron@43.4.0 --no-audit --no-fund

      - name: Verify Electron fallback
        env:
          ELECTRON_WINUI_PACKAGE_ROOT: ${{ github.workspace }}/consumer/node_modules/electron-winui
        run: xvfb-run --auto-servernum ./consumer/node_modules/.bin/electron --no-sandbox test/non-windows-fallback-app.js
